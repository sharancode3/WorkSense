name: WorkSense CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Linter (Flake8)
        run: flake8 app tests --max-line-length=130

      - name: Run Backend Automated Tests (Pytest)
        run: pytest tests/ -v

      - name: Verify Application Import & Factory
        run: python -c "from app.main import app; assert app.title == 'WorkSense API'"

  frontend-ci:
    name: Frontend Lint, Typecheck, Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Frontend Linter (ESLint)
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npm run typecheck

      - name: Run Frontend Tests (Vitest)
        run: npm run test

      - name: Run Production Build (Next.js)
        run: npm run build
